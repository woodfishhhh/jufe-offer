server {
    listen 80;
    listen [::]:80;
    server_name jufe.woodfish.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jufe.woodfish.site;

    ssl_certificate /etc/letsencrypt/live/jufe.woodfish.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jufe.woodfish.site/privkey.pem;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # Root-owned helper atomically changes this include between :3020 and :3021.
        include /etc/nginx/conf.d/jufe-offer-upstream.inc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

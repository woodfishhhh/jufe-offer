name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      migration_mode:
        description: Database migration mode when production and candidate migrations differ
        required: true
        default: maintenance
        type: choice
        options:
          - maintenance
          - compatible

permissions:
  actions: read
  contents: read

concurrency:
  group: jufe-offer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_mode || 'maintenance' }}

jobs:
  verify-and-build:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build and analysis caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
            .cache/eslint
            tsconfig.tsbuildinfo
          key: jufe-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            jufe-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}-
            jufe-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build production release
        run: pnpm build
        env:
          ADMIN_PASSWORD_HASH: ci-placeholder
          ADMIN_USERNAME: ci
          APP_REVISION: ${{ github.sha }}
          DATABASE_URL: file:./ci.db
          HTML_IN_CANVAS_OT_TOKEN: ${{ secrets.HTML_IN_CANVAS_OT_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://jufe.woodfish.site
          SESSION_SECRET: ci-only-session-secret-not-used-in-production

      - name: Assemble immutable release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash deploy/assemble-release.sh "$GITHUB_SHA"

      # The artifact only crosses the build/deploy job boundary. The server receives rsync deltas.
      - name: Upload release artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/jufe-offer-${{ github.sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to JDCloud
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://jufe.woodfish.site

    steps:
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jufe-offer-${{ github.sha }}.tar.gz
          path: dist

      - name: Extract release
        run: |
          mkdir -p dist/release
          tar -xzf "dist/jufe-offer-${GITHUB_SHA}.tar.gz" -C dist/release
          (
            cd dist/release
            test "$(cat REVISION)" = "$GITHUB_SHA"
            sha256sum --strict --check --quiet release.manifest.sha256
          )

      - name: Configure pinned SSH host
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Incrementally synchronize candidate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          staging_dir="/opt/jufe-offer/releases/.staging-${GITHUB_SHA}"
          remote_script="/opt/jufe-offer/incoming/deploy-release.sh"
          remote_script_staging="${remote_script}.next-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_options=(
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          rsync_ssh="ssh -p $DEPLOY_PORT -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6"

          scp \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            deploy/deploy-release.sh \
            "$remote:$remote_script_staging"
          ssh "${ssh_options[@]}" "$remote" \
            "chmod 0755 '$remote_script_staging' \
              && mv -f -- '$remote_script_staging' '$remote_script' \
              && bash '$remote_script' prepare '${GITHUB_SHA}'"

          synchronized=false
          for attempt in 1 2 3; do
            if rsync \
              --archive \
              --compress \
              --checksum \
              --delete-delay \
              --partial \
              --partial-dir=.rsync-partial \
              --safe-links \
              --link-dest=/opt/jufe-offer/current \
              --itemize-changes \
              --stats \
              --timeout=120 \
              -e "$rsync_ssh" \
              dist/release/ "$remote:$staging_dir/"; then
              synchronized=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$synchronized" = true

      - name: Start candidate and switch verified traffic
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$remote" \
            "bash /opt/jufe-offer/incoming/deploy-release.sh activate '${GITHUB_SHA}' '${MIGRATION_MODE}'"

      # This is observability outside the server. Failure does not invoke database or traffic rollback.
      - name: Verify public release with retries
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors --max-time 15 \
            https://jufe.woodfish.site/api/health)"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.ok !== true || payload.revision !== process.argv[2]) {
              console.error("Unexpected public health payload", payload);
              process.exit(1);
            }
          ' "$response" "$GITHUB_SHA"

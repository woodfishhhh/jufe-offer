name: Community Submission Bot

on:
  issues:
    types:
      - opened
  schedule:
    # GitHub Actions uses UTC; 16:00 UTC is 00:00 in Asia/Shanghai.
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: jufe-offer-community-submission-bot
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  friend-link-bot:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[友链申请]') ||
      startsWith(github.event.issue.title, '[Friend Link]') ||
      startsWith(github.event.issue.title, '[开源项目提交]') ||
      startsWith(github.event.issue.title, '[Open Source Project]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for rendered link checks
        if: github.event_name != 'issues'
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "jufe-offer-community-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reply to new community submission issue
        if: github.event_name == 'issues'
        run: pnpm friend-link-bot opened

      - name: Review pending community submission issues
        if: github.event_name != 'issues'
        run: pnpm friend-link-bot review

      - name: Trigger CI for accepted submissions
        if: always() && github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          git fetch --quiet origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" = "$INITIAL_SHA" ] || [ "$current_sha" != "$remote_sha" ]; then
            echo "No new submission commit is present on origin/main; CI is not needed."
            exit 0
          fi

          echo "Community submission bot created $current_sha; triggering CI for main."
          gh workflow run ci-deploy.yml --ref main

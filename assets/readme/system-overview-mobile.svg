<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190" role="img" aria-labelledby="title description">
  <title id="title">江财OFFER系统全景</title>
  <description id="description">访问者和自动化入口经过 Next.js 应用与 SQLite 数据层，形成首页、资源页和友链页，并通过蓝绿部署发布</description>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b91b20"/>
    </marker>
  </defs>
  <rect width="720" height="1190" rx="30" fill="#f5f5f2"/>
  <text x="48" y="58" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3">SYSTEM OVERVIEW</text>
  <path d="M48 82H672" stroke="#111111" stroke-opacity="0.12"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(48 116)">
      <rect width="624" height="186" rx="24" fill="#ffffff" stroke="#111111" stroke-opacity="0.13"/>
      <text x="26" y="42" fill="#b91b20" font-size="18" font-weight="700">01 / 进入站点</text>
      <text x="26" y="88" fill="#111111" font-size="30" font-weight="750">学生 · 维护者 · 自动化</text>
      <text x="26" y="130" fill="#111111" fill-opacity="0.56" font-size="21">浏览搜索、加入社群、编辑资源</text>
      <text x="26" y="162" fill="#111111" fill-opacity="0.56" font-size="21">OpenClaw 与 Issue Bot 提交信息</text>
    </g>
    <path d="M360 314V360" stroke="#b91b20" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(48 380)">
      <rect width="624" height="254" rx="24" fill="#101010"/>
      <text x="26" y="42" fill="#f6c453" font-size="18" font-weight="700">02 / Next.js 16 应用</text>
      <text x="26" y="90" fill="#ffffff" font-size="30" font-weight="750">一套站点，多个入口</text>
      <text x="26" y="136" fill="#ffffff" fill-opacity="0.72" font-size="22">/1—6　交互首页</text>
      <text x="26" y="178" fill="#ffffff" fill-opacity="0.72" font-size="22">/resources　资源目录</text>
      <text x="26" y="220" fill="#ffffff" fill-opacity="0.72" font-size="22">/friends　友链与连接</text>
    </g>
    <path d="M360 646V692" stroke="#b91b20" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(48 712)">
      <rect width="624" height="198" rx="24" fill="#ffffff" stroke="#111111" stroke-opacity="0.13"/>
      <text x="26" y="42" fill="#b91b20" font-size="18" font-weight="700">03 / Prisma + SQLite</text>
      <text x="26" y="90" fill="#111111" font-size="30" font-weight="750">公开数据与来源证据</text>
      <text x="26" y="138" fill="#111111" fill-opacity="0.56" font-size="21">Resource · Candidate</text>
      <text x="26" y="170" fill="#111111" fill-opacity="0.56" font-size="21">RepositoryProfile · 本地资产</text>
    </g>
    <path d="M360 922V968" stroke="#b91b20" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(48 988)">
      <rect width="624" height="138" rx="24" fill="#b91b20"/>
      <text x="26" y="42" fill="#ffffff" font-size="18" font-weight="700">04 / 持续交付</text>
      <text x="26" y="88" fill="#ffffff" font-size="30" font-weight="750">Migration + Blue / Green</text>
      <text x="26" y="118" fill="#ffffff" fill-opacity="0.72" font-size="20">候选版本通过健康检查后再切流</text>
    </g>
  </g>
  <text x="48" y="1160" fill="#111111" fill-opacity="0.42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">DISCOVER · ORGANIZE · SHARE</text>
</svg>

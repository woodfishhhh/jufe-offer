<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1260" viewBox="0 0 760 1260" role="img" aria-labelledby="title description">
  <title id="title">校内开源项目数据流</title>
  <description id="description">从 GitHub Issue 投稿，经机器人核验和仓库资料同步，进入 SQLite 后复用于首页与资源页</description>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b91b20"/>
    </marker>
  </defs>
  <rect width="760" height="1260" rx="32" fill="#f5f5f2"/>
  <text x="60" y="66" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="4">OPEN SOURCE PIPELINE</text>
  <path d="M60 92H700" stroke="#111111" stroke-opacity="0.12"/>

  <g font-family="Arial, Helvetica, 'Microsoft YaHei', sans-serif">
    <g transform="translate(60 126)">
      <rect width="640" height="210" rx="28" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="30" y="46" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">01 / SUBMIT</text>
      <text x="30" y="102" fill="#111111" font-size="34" font-weight="700">GitHub Issue 投稿</text>
      <text x="30" y="150" fill="#111111" fill-opacity="0.58" font-size="22">仓库地址 · 参与关系 · 标签</text>
      <text x="30" y="184" fill="#111111" fill-opacity="0.58" font-size="22">公开声明与去重校验</text>
    </g>
    <path d="M380 348V392" stroke="#b91b20" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(60 410)">
      <rect width="640" height="210" rx="28" fill="#101010"/>
      <text x="30" y="46" fill="#f6c453" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">02 / ENRICH</text>
      <text x="30" y="102" fill="#ffffff" font-size="34" font-weight="700">同步仓库资料</text>
      <text x="30" y="150" fill="#ffffff" fill-opacity="0.56" font-size="22">Description · Star · 语言</text>
      <text x="30" y="184" fill="#ffffff" fill-opacity="0.56" font-size="22">头像压缩为 320px WebP</text>
    </g>
    <path d="M380 632V676" stroke="#b91b20" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(60 694)">
      <rect width="640" height="210" rx="28" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="30" y="46" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">03 / STORE</text>
      <text x="30" y="102" fill="#111111" font-size="34" font-weight="700">Resource + Profile</text>
      <text x="30" y="150" fill="#111111" fill-opacity="0.58" font-size="22">SQLite 是展示数据源</text>
      <text x="30" y="184" fill="#111111" fill-opacity="0.58" font-size="22">删除后请求时立即消失</text>
    </g>
    <path d="M380 916V960" stroke="#b91b20" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(60 978)">
      <rect width="640" height="210" rx="28" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="30" y="46" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">04 / REUSE</text>
      <text x="30" y="102" fill="#111111" font-size="34" font-weight="700">一份数据，两处呈现</text>
      <text x="30" y="150" fill="#111111" fill-opacity="0.58" font-size="22">首页第 4 页 · 漂移墙</text>
      <text x="30" y="184" fill="#111111" fill-opacity="0.58" font-size="22">资源页 · 校内开源项目</text>
    </g>
  </g>
  <text x="60" y="1224" fill="#111111" fill-opacity="0.46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">LOCAL ASSETS · SERVER-SIDE ADMIN</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title description">
  <title id="title">校内开源项目数据流</title>
  <description id="description">从 GitHub Issue 投稿，经机器人核验和仓库资料同步，进入 SQLite 后复用于首页与资源页</description>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b91b20"/>
    </marker>
  </defs>
  <rect width="1600" height="430" rx="32" fill="#f5f5f2"/>
  <path d="M72 82H1528M72 348H1528" stroke="#111111" stroke-opacity="0.12"/>
  <text x="72" y="58" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4">OPEN SOURCE SUBMISSION PIPELINE</text>

  <g font-family="Arial, Helvetica, 'Microsoft YaHei', sans-serif">
    <g transform="translate(72 120)">
      <rect width="280" height="182" rx="24" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="24" y="40" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">01 / SUBMIT</text>
      <text x="24" y="88" fill="#111111" font-size="27" font-weight="700">GitHub Issue 投稿</text>
      <text x="24" y="126" fill="#111111" fill-opacity="0.58" font-size="17">仓库地址 · 参与关系 · 标签</text>
      <text x="24" y="154" fill="#111111" fill-opacity="0.58" font-size="17">公开声明与去重校验</text>
    </g>
    <path d="M368 211H422" stroke="#b91b20" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(440 120)">
      <rect width="300" height="182" rx="24" fill="#101010"/>
      <text x="24" y="40" fill="#f6c453" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">02 / ENRICH</text>
      <text x="24" y="88" fill="#ffffff" font-size="27" font-weight="700">同步仓库资料</text>
      <text x="24" y="126" fill="#ffffff" fill-opacity="0.56" font-size="17">Description · Star · 语言</text>
      <text x="24" y="154" fill="#ffffff" fill-opacity="0.56" font-size="17">头像压缩为 320px WebP</text>
    </g>
    <path d="M756 211H810" stroke="#b91b20" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(828 120)">
      <rect width="300" height="182" rx="24" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="24" y="40" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">03 / STORE</text>
      <text x="24" y="88" fill="#111111" font-size="27" font-weight="700">Resource + Profile</text>
      <text x="24" y="126" fill="#111111" fill-opacity="0.58" font-size="17">SQLite 是展示数据源</text>
      <text x="24" y="154" fill="#111111" fill-opacity="0.58" font-size="17">删除后请求时立即消失</text>
    </g>
    <path d="M1144 211H1198" stroke="#b91b20" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1216 120)">
      <rect width="312" height="182" rx="24" fill="#ffffff" stroke="#111111" stroke-opacity="0.14"/>
      <text x="24" y="40" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">04 / REUSE</text>
      <text x="24" y="88" fill="#111111" font-size="27" font-weight="700">一份数据，两处呈现</text>
      <text x="24" y="126" fill="#111111" fill-opacity="0.58" font-size="17">首页第 4 页 · 漂移墙</text>
      <text x="24" y="154" fill="#111111" fill-opacity="0.58" font-size="17">资源页 · 校内开源项目</text>
    </g>
  </g>
  <text x="72" y="386" fill="#111111" fill-opacity="0.46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">NO RUNTIME GITHUB AVATAR REQUESTS · SERVER-SIDE ADMIN BOUNDARY</text>
</svg>

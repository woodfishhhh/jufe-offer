<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">江财OFFER系统全景</title>
  <description id="description">学生、维护者和自动化入口经过 Next.js 应用与 SQLite 数据层，形成六页首页、资源目录和友链页面，并通过蓝绿部署发布</description>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b91b20"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f5f5f2"/>
  <text x="52" y="52" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">JUFE OFFER / SYSTEM OVERVIEW</text>
  <path d="M52 76H1148" stroke="#111111" stroke-opacity="0.12"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="52" y="116" fill="#111111" fill-opacity="0.46" font-size="18">进入站点</text>
    <g transform="translate(52 136)">
      <rect width="230" height="76" rx="18" fill="#ffffff" stroke="#111111" stroke-opacity="0.13"/>
      <text x="20" y="32" fill="#111111" font-size="22" font-weight="700">江财学生</text>
      <text x="20" y="58" fill="#111111" fill-opacity="0.52" font-size="18">浏览 · 搜索 · 加入社群</text>
    </g>
    <g transform="translate(52 226)">
      <rect width="230" height="76" rx="18" fill="#ffffff" stroke="#111111" stroke-opacity="0.13"/>
      <text x="20" y="32" fill="#111111" font-size="22" font-weight="700">维护者</text>
      <text x="20" y="58" fill="#111111" fill-opacity="0.52" font-size="18">编辑资源 · 审核 · 发布</text>
    </g>
    <g transform="translate(52 316)">
      <rect width="230" height="92" rx="18" fill="#101010"/>
      <text x="20" y="34" fill="#ffffff" font-size="22" font-weight="700">自动化入口</text>
      <text x="20" y="62" fill="#ffffff" fill-opacity="0.58" font-size="18">OpenClaw · Issue Bot</text>
    </g>

    <path d="M300 272H354" stroke="#b91b20" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(372 124)">
      <rect width="340" height="296" rx="26" fill="#101010"/>
      <text x="26" y="42" fill="#f6c453" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">NEXT.JS 16 APPLICATION</text>
      <text x="26" y="86" fill="#ffffff" font-size="30" font-weight="750">一套站点，多个入口</text>
      <g fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12">
        <rect x="26" y="112" width="288" height="42" rx="12"/>
        <rect x="26" y="164" width="288" height="42" rx="12"/>
        <rect x="26" y="216" width="288" height="42" rx="12"/>
      </g>
      <g fill="#ffffff" font-size="20">
        <text x="44" y="140">/1—6 · 交互首页</text>
        <text x="44" y="192">/resources · 资源目录</text>
        <text x="44" y="244">/friends · 友链与连接</text>
      </g>
      <text x="26" y="280" fill="#ffffff" fill-opacity="0.46" font-size="18">Route Handlers · Session · Validation</text>
    </g>

    <path d="M730 272H784" stroke="#b91b20" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="802" y="116" fill="#111111" fill-opacity="0.46" font-size="18">数据与交付</text>
    <g transform="translate(802 136)">
      <rect width="346" height="124" rx="20" fill="#ffffff" stroke="#111111" stroke-opacity="0.13"/>
      <text x="22" y="34" fill="#b91b20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">PRISMA + SQLITE</text>
      <text x="22" y="70" fill="#111111" font-size="22" font-weight="700">公开数据与来源证据</text>
      <text x="22" y="100" fill="#111111" fill-opacity="0.52" font-size="18">Resource · Candidate · RepositoryProfile</text>
    </g>
    <g transform="translate(802 274)">
      <rect width="166" height="118" rx="20" fill="#ffffff" stroke="#111111" stroke-opacity="0.13"/>
      <text x="20" y="34" fill="#b91b20" font-size="18" font-weight="700">站内资产</text>
      <text x="20" y="68" fill="#111111" fill-opacity="0.56" font-size="18">头像 · 二维码</text>
      <text x="20" y="94" fill="#111111" fill-opacity="0.56" font-size="18">GLB · WebP</text>
    </g>
    <g transform="translate(982 274)">
      <rect width="166" height="118" rx="20" fill="#b91b20"/>
      <text x="20" y="34" fill="#ffffff" font-size="18" font-weight="700">持续交付</text>
      <text x="20" y="68" fill="#ffffff" fill-opacity="0.72" font-size="18">Migration</text>
      <text x="20" y="94" fill="#ffffff" fill-opacity="0.72" font-size="18">Blue / Green</text>
    </g>
  </g>
  <path d="M52 452H1148" stroke="#111111" stroke-opacity="0.12"/>
  <text x="52" y="486" fill="#111111" fill-opacity="0.44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">DISCOVER → ORGANIZE → SHARE → BUILD TOGETHER</text>
</svg>
